# OracleDataSourceConfiguration requires ORACLE_JDBC_URL, ORACLE_DB_USER,
# and ORACLE_DB_PASSWORD and verifies the connection before startup completes.
# Load the Git-ignored local settings from the module working directory.
spring.config.import=optional:file:./.env[.properties]
# There is no in-memory fallback or automatic schema initialization.
spring.sql.init.mode=never
server.servlet.session.cookie.secure=false
